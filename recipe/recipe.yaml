schema_version: 1

context:
  name: znflow
  version: "0.2.8"
  python_min: "3.10"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/znflow-${{ version }}.tar.gz
  sha256: 9ab560c72a9f9d64af09db9b43cab8fc8d5842cde8a6978af8d9601b7b2b5568

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python 3.10.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - networkx >=3.4.2
  run_constraints:
    - dask-core >=2024.0.0,<2025.0.0
    - distributed >=2024.0.0,<2025.0.0

tests:
  - python:
      imports:
        - znflow
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: A general purpose framework for building and running computational graphs.
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/zincware/ZnFlow

extra:
  recipe-maintainers:
    - jan-janssen
